name: Keep Supabase alive

# Hits a real PostgREST endpoint to register database activity.
# Supabase pauses free-tier projects after ~7 days of no DB queries —
# /health does NOT count, only authenticated REST/Auth/Storage calls do.
# Anon key is public (also in supabase-config.js) — safe to commit.

on:
  schedule:
    - cron: '0 9 */2 * *'  # Every 2 days at 09:00 UTC (margin against the 7-day window)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query annotations table
        env:
          SUPABASE_URL: https://qzenmfbqjmraknmakgel.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6ZW5tZmJxam1yYWtubWFrZ2VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzOTE0MDEsImV4cCI6MjA3ODk2NzQwMX0.76cmKHheDBoUk1rMwOV0EypQ1TVdJDN8nPsTrERwMdg
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/annotations?select=id&limit=1")
          echo "HTTP $status"
          cat /tmp/body
          echo
          if [ "$status" != "200" ]; then
            echo "Keepalive failed — Supabase did not return 200"
            exit 1
          fi
